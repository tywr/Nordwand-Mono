name: Build release fonts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Install fontforge
        run: |
          if ! command -v fontforge >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y fontforge
          fi

      - name: Build fonts
        env:
          FONT_VERSION: ${{ github.event.release.tag_name }}
        run: |
          make build-font FONT_VERSION="$FONT_VERSION"
          make build-nl-font FONT_VERSION="$FONT_VERSION"

      - name: Cache Nerd Fonts patcher
        uses: actions/cache@v4
        with:
          path: .nerd-fonts/3.5.1
          key: nerd-fonts-patcher-v3.5.1

      - name: Build Nerd fonts
        run: make build-nerd-font

      - name: Package fonts
        run: |
          zip -j NordwandMono-OTF.zip fonts/otf/NordwandMono-*.otf
          zip -j NordwandMono-TTF.zip fonts/ttf/NordwandMono-*.ttf
          zip -j NordwandMonoNL-OTF.zip fonts/otf/NordwandMonoNL-*.otf
          zip -j NordwandMonoNL-TTF.zip fonts/ttf/NordwandMonoNL-*.ttf
          zip -j NordwandMono-WOFF.zip fonts/woff/*.woff
          zip -j NordwandMono-WOFF2.zip fonts/woff2/*.woff2
          cd fonts/nerd-font
          zip -j ../../NerdwandMono-OTF.zip otf/NerdwandMono-*.otf LICENSE-FONT.txt
          zip -r ../../NerdwandMono-OTF.zip licenses
          zip -j ../../NerdwandMono-TTF.zip ttf/NerdwandMono-*.ttf LICENSE-FONT.txt
          zip -r ../../NerdwandMono-TTF.zip licenses

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            NordwandMono-OTF.zip \
            NordwandMono-TTF.zip \
            NordwandMonoNL-OTF.zip \
            NordwandMonoNL-TTF.zip \
            NordwandMono-WOFF.zip \
            NordwandMono-WOFF2.zip \
            NerdwandMono-OTF.zip \
            NerdwandMono-TTF.zip \
            --clobber
